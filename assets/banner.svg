<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
  <defs>
    <pattern id="apx-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3b4cc0" stroke-opacity="0.06" />
    </pattern>
    <marker id="apx-ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3b4cc0" />
    </marker>
  </defs>

  <rect width="1100" height="300" fill="#f4f6f8" />
  <rect x="16" y="16" width="1068" height="268" fill="url(#apx-grid)" />

  <!-- sheet frame + registration marks -->
  <rect x="16" y="16" width="1068" height="268" fill="none" stroke="#3b4cc0" stroke-width="1.8" />
  <rect x="26" y="26" width="1048" height="248" fill="none" stroke="#3b4cc0" stroke-opacity="0.35" stroke-width="1" />
  <g stroke="#3b4cc0" stroke-width="1.2">
    <path d="M8 16 H24 M16 8 V24" />
    <path d="M1076 16 H1092 M1084 8 V24" />
    <path d="M8 284 H24 M16 276 V292" />
    <path d="M1076 284 H1092 M1084 276 V292" />
  </g>

  <!-- title block: logo + name -->
  <path d="M68 40 L87.1 51 V73 L68 84 L48.9 73 V51 Z" fill="none" stroke="#3b4cc0" stroke-width="2.2" stroke-linejoin="round" />
  <circle cx="68" cy="62" r="6.5" fill="none" stroke="#3b4cc0" stroke-width="1.8" />
  <text x="100" y="76" font-family="'JetBrains Mono','Fira Code',monospace" font-size="48" font-weight="700" fill="#1a1f36" letter-spacing="5">AUTOPARTS</text>
  <text x="102" y="100" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#5b6478">b2b fleet supply &#183; agentpay/1.0 merchant protocol</text>

  <!-- sheet annotations -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3b4cc0" text-anchor="end">
    <text x="1048" y="50">dwg ap-agp-001 &#183; rev b &#183; sheet 1/1</text>
    <text x="1048" y="68">agentpay/1.0 &#183; rfc 8785 jcs &#183; es256</text>
    <text x="1048" y="86">scale 1:1 &#183; payment rail: mocked</text>
  </g>

  <!-- dimension line over the pipeline -->
  <line x1="57" y1="124" x2="1043" y2="124" stroke="#3b4cc0" stroke-width="1" />
  <line x1="57" y1="118" x2="57" y2="130" stroke="#3b4cc0" stroke-width="1.4" />
  <line x1="1043" y1="118" x2="1043" y2="130" stroke="#3b4cc0" stroke-width="1.4" />
  <text x="550" y="117" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3b4cc0" text-anchor="middle" letter-spacing="1">QUOTE &#8594; JCS &#8594; ES256 &#8594; MANDATE VERIFY</text>

  <!-- inter-stage arrows -->
  <g stroke="#3b4cc0" stroke-width="1.6">
    <line x1="272" y1="174" x2="311" y2="174" marker-end="url(#apx-ar)" />
    <line x1="487" y1="174" x2="526" y2="174" marker-end="url(#apx-ar)" />
    <line x1="702" y1="174" x2="741" y2="174" marker-end="url(#apx-ar)" />
  </g>

  <!-- signal pulse riding the pipeline (visible in the gaps) -->
  <circle r="3.5" fill="#3b4cc0">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M57 174 L1043 174" />
  </circle>

  <!-- stage 1: quote request -->
  <rect x="57" y="136" width="215" height="76" rx="3" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text x="73" y="160" font-weight="700" fill="#3b4cc0">post</text>
    <text x="73" y="180" fill="#1a1f36">/v1/agents-pay/quotes</text>
    <text x="73" y="200" fill="#5b6478">items + idempotency-key</text>
  </g>

  <!-- stage 2: canonicalization -->
  <rect x="317" y="136" width="170" height="76" rx="3" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text x="333" y="160" font-weight="700" fill="#3b4cc0">rfc 8785</text>
    <text x="333" y="180" fill="#1a1f36">jcs canonicalize</text>
    <text x="333" y="200" fill="#5b6478">deterministic</text>
  </g>

  <!-- stage 3: signature -->
  <rect x="532" y="136" width="170" height="76" rx="3" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text x="548" y="160" font-weight="700" fill="#3b4cc0">es256 sign</text>
    <text x="548" y="180" fill="#1a1f36">jws qte_9821a</text>
    <text x="548" y="200" fill="#5b6478">immutable quote</text>
  </g>
  <!-- seal stamp on corner -->
  <circle cx="702" cy="136" r="13" fill="#f4f6f8" stroke="#e8590c" stroke-width="1.6" />
  <circle cx="702" cy="136" r="8" fill="none" stroke="#e8590c" stroke-width="1.1" />
  <circle cx="702" cy="136" r="13" fill="none" stroke="#e8590c" stroke-width="1.4">
    <animate attributeName="r" values="13;26" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- stage 4: mandate verification -->
  <rect x="747" y="136" width="296" height="76" rx="3" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text x="763" y="158" font-weight="700" fill="#3b4cc0">post /v1/agents-pay</text>
    <text x="763" y="178" fill="#1a1f36">/orders/{orderRef}/verification</text>
    <text x="763" y="198" fill="#5b6478">token verify &#8594; <tspan fill="#e8590c" font-weight="700">inv-2026-089</tspan></text>
  </g>

  <!-- drafting balloons -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" font-weight="700" fill="#3b4cc0" text-anchor="middle">
    <circle cx="57" cy="136" r="12" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
    <text x="57" y="140.5">1</text>
    <circle cx="317" cy="136" r="12" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
    <text x="317" y="140.5">2</text>
    <circle cx="532" cy="136" r="12" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
    <text x="532" y="140.5">3</text>
    <circle cx="747" cy="136" r="12" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
    <text x="747" y="140.5">4</text>
  </g>

  <!-- endpoint notes -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13">
    <text x="150" y="248" text-anchor="end" fill="#5b6478">discovery:</text>
    <text x="162" y="248" fill="#1a1f36">get /.well-known/agentpay.json</text>
    <text x="150" y="268" text-anchor="end" fill="#5b6478">search:</text>
    <text x="162" y="268" fill="#1a1f36">post /v1/agents-pay/search</text>
  </g>

  <!-- tolerance dimension -->
  <line x1="440" y1="258" x2="740" y2="258" stroke="#3b4cc0" stroke-width="1" />
  <line x1="440" y1="252" x2="440" y2="264" stroke="#3b4cc0" stroke-width="1.4" />
  <line x1="740" y1="252" x2="740" y2="264" stroke="#3b4cc0" stroke-width="1.4" />
  <text x="590" y="250" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3b4cc0" text-anchor="middle">quotes immutable &#183; tokens single-use</text>

  <!-- engineering title block -->
  <rect x="757" y="234" width="286" height="42" fill="#ffffff" stroke="#3b4cc0" stroke-width="1.5" />
  <line x1="887" y1="234" x2="887" y2="276" stroke="#3b4cc0" stroke-width="1" />
  <line x1="957" y1="234" x2="957" y2="276" stroke="#3b4cc0" stroke-width="1" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#1a1f36" text-anchor="middle">
    <text x="822" y="260">dwg ap-agp-001</text>
    <text x="922" y="260">rev b</text>
    <text x="1000" y="260">scale 1:1</text>
  </g>
</svg>
