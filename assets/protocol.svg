<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <pattern id="apxp-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#635bff" stroke-opacity="0.06" />
    </pattern>
    <marker id="apx-ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#7a74ff" />
    </marker>
    <marker id="apx-ar-m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#5a6690" />
    </marker>
    <marker id="apx-ar-a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#10141f" />
  <rect x="14" y="14" width="972" height="572" rx="12" fill="#131a2b" />
  <rect x="14" y="14" width="972" height="572" rx="12" fill="url(#apxp-grid)" />
  <rect x="14" y="14" width="972" height="572" rx="12" fill="none" stroke="#26304a" stroke-width="1.5" />

  <text x="40" y="46" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" font-weight="700" fill="#e9edf6">quote_to_order &#183; sequence</text>
  <text x="40" y="64" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#8a93ab">agentpay/1.0 merchant protocol &#183; payloads per docs/agentpay-protocol.md</text>

  <!-- lifelines -->
  <g stroke="#2c3a60" stroke-width="1" stroke-dasharray="4 5">
    <line x1="180" y1="92" x2="180" y2="555" />
    <line x1="500" y1="92" x2="500" y2="555" />
    <line x1="820" y1="92" x2="820" y2="555" />
  </g>

  <!-- lane headers -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" text-anchor="middle">
    <rect x="100" y="76" width="160" height="38" rx="8" fill="#182036" stroke="#2c3a60" />
    <text x="180" y="93" font-size="12" font-weight="700" fill="#e9edf6">procurement agent</text>
    <text x="180" y="107" font-size="9" fill="#8a93ab">fleet buyer</text>

    <rect x="415" y="76" width="170" height="38" rx="8" fill="#1c2440" stroke="#635bff" />
    <text x="500" y="93" font-size="12" font-weight="700" fill="#9d97ff">autoparts</text>
    <text x="500" y="107" font-size="9" fill="#7a74ff">b2b merchant</text>

    <rect x="730" y="76" width="180" height="38" rx="8" fill="#182036" stroke="#2c3a60" />
    <text x="820" y="93" font-size="12" font-weight="700" fill="#e9edf6">mandate authority</text>
    <text x="820" y="107" font-size="9" fill="#8a93ab">agentpay</text>
  </g>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#aab3c8" text-anchor="middle">

    <text x="340" y="122">01 GET /.well-known/agentpay.json</text>
    <line x1="180" y1="130" x2="494" y2="130" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="340" y="152">02 manifest &#183; agentpay/1.0 &#183; capabilities &#183; endpoints</text>
    <line x1="500" y1="160" x2="186" y2="160" stroke="#5a6690" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="340" y="190">03 POST /v1/agents-pay/search { query }</text>
    <line x1="180" y1="198" x2="494" y2="198" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="340" y="220">04 fleet skus &#183; price &#183; moq</text>
    <line x1="500" y1="228" x2="186" y2="228" stroke="#5a6690" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="340" y="258">05 POST /v1/agents-pay/quotes &#183; items + Idempotency-Key</text>
    <line x1="180" y1="266" x2="494" y2="266" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="640" y="296" fill="#f59e0b">06 rfc 8785 jcs canonicalize &#8594; es256 sign</text>
    <path d="M500 304 L560 304 L560 320 L503 320" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#apx-ar-a)" />

    <text x="340" y="334">07 signed quote JWS qte_9821a &#183; subtotal &#183; tax &#183; shipping &#183; expiry</text>
    <line x1="500" y1="342" x2="186" y2="342" stroke="#5a6690" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="500" y="372">08 intent evaluated vs mandate mnd_7f2a &#8594; token vt_mock_a89f</text>
    <line x1="180" y1="380" x2="814" y2="380" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="500" y="410">09 POST /v1/agents-pay/orders/{ref}/verification &#183; quoteId + paymentToken</text>
    <line x1="180" y1="418" x2="494" y2="418" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="660" y="448">10 verify payment token + live mandate status</text>
    <line x1="500" y1="456" x2="814" y2="456" stroke="#7a74ff" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="660" y="486">11 token valid &#183; single-use consumed</text>
    <line x1="820" y1="494" x2="506" y2="494" stroke="#5a6690" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="340" y="524" fill="#f59e0b" font-weight="700">12 order confirmed &#183; invoice INV-2026-089</text>
    <line x1="500" y1="532" x2="186" y2="532" stroke="#5a6690" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />
  </g>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="9.5" fill="#5f6b85">
    <line x1="40" y1="556" x2="960" y2="556" stroke="#26304a" stroke-width="1" />
    <text x="40" y="574">quotes are immutable JWS (es256) &#183; requests canonicalized with rfc 8785 jcs &#183; payment tokens are single-use and verified live &#183; rail mocked by design</text>
  </g>
</svg>
