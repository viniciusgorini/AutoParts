<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <pattern id="apxp-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#3b4cc0" stroke-opacity="0.05" />
    </pattern>
    <marker id="apx-ar" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#3b4cc0" />
    </marker>
    <marker id="apx-ar-m" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8a93ab" />
    </marker>
    <marker id="apx-ar-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#e8590c" />
    </marker>
  </defs>

  <rect width="1000" height="600" fill="#f4f6f8" />
  <rect x="14" y="14" width="972" height="572" rx="3" fill="url(#apxp-grid)" />
  <rect x="14" y="14" width="972" height="572" rx="3" fill="none" stroke="#3b4cc0" stroke-width="1.6" />
  <rect x="22" y="22" width="956" height="556" fill="none" stroke="#3b4cc0" stroke-opacity="0.3" stroke-width="1" />

  <text x="40" y="48" font-family="'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="700" fill="#1a1f36">quote_to_order &#183; sequence</text>
  <text x="40" y="68" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#5b6478">agentpay/1.0 merchant protocol &#183; payloads per docs/agentpay-protocol.md</text>
  <text x="960" y="48" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3b4cc0" text-anchor="end">dwg ap-agp-002 &#183; sheet 2/2</text>

  <!-- lifelines -->
  <g stroke="#b9c3dd" stroke-width="1" stroke-dasharray="4 5">
    <line x1="170" y1="96" x2="170" y2="555" />
    <line x1="500" y1="96" x2="500" y2="555" />
    <line x1="830" y1="96" x2="830" y2="555" />
  </g>

  <!-- lane headers -->
  <g font-family="'JetBrains Mono','Fira Code',monospace" text-anchor="middle">
    <rect x="90" y="74" width="160" height="42" rx="6" fill="#ffffff" stroke="#b9c3dd" />
    <text x="170" y="91" font-size="14" font-weight="700" fill="#1a1f36">procurement agent</text>
    <text x="170" y="108" font-size="13" fill="#5b6478">fleet buyer</text>

    <rect x="410" y="74" width="180" height="42" rx="6" fill="#eef0fb" stroke="#3b4cc0" />
    <text x="500" y="91" font-size="14" font-weight="700" fill="#3b4cc0">autoparts</text>
    <text x="500" y="108" font-size="13" fill="#3b4cc0">b2b merchant</text>

    <rect x="735" y="74" width="190" height="42" rx="6" fill="#ffffff" stroke="#b9c3dd" />
    <text x="830" y="91" font-size="14" font-weight="700" fill="#1a1f36">mandate authority</text>
    <text x="830" y="108" font-size="13" fill="#5b6478">agentpay registry</text>
  </g>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3c4457" text-anchor="middle">

    <text x="335" y="136">01 GET /.well-known/agentpay.json</text>
    <line x1="170" y1="144" x2="494" y2="144" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="335" y="166">02 manifest &#183; agentpay/1.0 &#183; endpoints</text>
    <line x1="500" y1="174" x2="176" y2="174" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="335" y="204">03 POST /v1/agents-pay/search</text>
    <line x1="170" y1="212" x2="494" y2="212" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="335" y="234">04 fleet skus &#183; price &#183; moq</text>
    <line x1="500" y1="242" x2="176" y2="242" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="335" y="272">05 POST /v1/agents-pay/quotes &#183; idem-key</text>
    <line x1="170" y1="280" x2="494" y2="280" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="490" y="302" text-anchor="end" fill="#e8590c">06 rfc 8785 jcs &#8594; es256 sign</text>
    <path d="M500 306 L560 306 L560 322 L503 322" fill="none" stroke="#e8590c" stroke-width="1.5" marker-end="url(#apx-ar-a)" />

    <text x="335" y="352">07 signed quote &#183; jws qte_9821a</text>
    <line x1="500" y1="360" x2="176" y2="360" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="500" y="390">08 intent vs mandate mnd_7f2a &#8594; token vt_*</text>
    <line x1="170" y1="398" x2="824" y2="398" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="335" y="428">09 POST /orders/{orderRef}/verification</text>
    <line x1="170" y1="436" x2="494" y2="436" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="665" y="466">10 verify token + mandate live status</text>
    <line x1="500" y1="474" x2="824" y2="474" stroke="#3b4cc0" stroke-width="1.5" marker-end="url(#apx-ar)" />

    <text x="665" y="504">11 token valid &#183; single-use consumed</text>
    <line x1="830" y1="512" x2="506" y2="512" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />

    <text x="335" y="542" fill="#e8590c" font-weight="700">12 order confirmed &#183; inv-2026-089</text>
    <line x1="500" y1="550" x2="176" y2="550" stroke="#8a93ab" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#apx-ar-m)" />
  </g>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#5b6478">
    <line x1="40" y1="564" x2="960" y2="564" stroke="#b9c3dd" stroke-width="1" />
    <text x="40" y="583">quotes are immutable jws (es256) &#183; requests canonicalized with rfc 8785 jcs &#183; tokens single-use, verified live</text>
  </g>
</svg>
